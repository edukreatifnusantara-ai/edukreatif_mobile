name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get --no-offline
        timeout-minutes: 10
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get --no-offline
        timeout-minutes: 10
      - name: Run tests
        run: |
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            flutter test --coverage
          else
            echo "No tests found, skipping"
          fi

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get --no-offline
        timeout-minutes: 10
      - name: Build APK (debug)
        run: flutter build apk --debug --split-per-abi
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get --no-offline
        timeout-minutes: 10
      - name: Build Web
        run: flutter build web --release
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev
          flutter pub get
      - name: Build Linux
        run: flutter build linux --debug
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/debug/bundle
          retention-days: 7

  check-size:
    name: Check App Size
    runs-on: ubuntu-latest
    needs: [build-apk, build-web, build-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts/apk
      - name: Check APK size
        run: |
          APK_SIZE=$(du -sb artifacts/apk | cut -f1)
          echo "APK Size: $APK_SIZE bytes ($((APK_SIZE / 1024 / 1024)) MB)"
          if [ $APK_SIZE -gt 52428800 ]; then
            echo "⚠️ APK exceeds 50MB limit!"
            exit 1
          fi
          echo "✅ APK size within 50MB limit"

  auto-merge:
    name: Auto Merge to Main
    runs-on: ubuntu-latest
    needs: [analyze, test, build-apk, build-web, build-linux, check-size]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.merged == false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Auto merge PR
        run: |
          gh pr merge --squash --admin --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}